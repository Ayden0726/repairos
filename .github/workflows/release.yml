name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 1.2.0)"
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workshopos
          POSTGRES_PASSWORD: workshopos_dev
          POSTGRES_DB: workshopos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshopos -d workshopos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test API
        run: dotnet test WorkshopOS.sln -c Release
      - name: Pack server bundle
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          bash scripts/publish-server.sh "$VERSION"
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshopos-server
          path: packaging/dist/WorkshopOS-Server-*.tar.gz

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build portable client zip
        shell: pwsh
        run: |
          $Version = "${{ github.event.inputs.version || github.ref_name }}"
          if ($Version.StartsWith("v")) { $Version = $Version.Substring(1) }
          ./packaging/build-client.ps1 -Configuration Release -SkipInstaller -Version $Version
      - name: Upload client zip
        uses: actions/upload-artifact@v4
        with:
          name: workshopos-client-win-x64
          path: packaging/dist/WorkshopOS-Client-*.zip

  release:
    needs: [server, windows-client]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workshopos-server/*
            workshopos-client-win-x64/*
          generate_release_notes: true
          body: |
            ## WorkshopOS release

            ### Install / update server (PC, NAS, WSL, or Raspberry Pi 3B+)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Ayden0726/repairos/main/scripts/get-workshopos.sh | bash
            # existing: cd ~/workshopos && git pull && ./scripts/restart-workshopos.sh --update
            ```

            1. Or download **WorkshopOS-Server-*.tar.gz**, extract, run `./install-server.sh` (Docker required).
            2. Download **WorkshopOS-Client-win-x64-*.zip** (or `WorkshopOS-Setup-*.exe`), install on Windows PCs.
            3. Open `http://<server>:5088/connect`, pair the client, complete first-run setup.
            4. Set **`Encryption__Key`** in `docker/.env` (installer does this on first run) — keep it forever.

            Docs: [INSTALL.md](docs/INSTALL.md) · [RASPBERRY_PI.md](docs/RASPBERRY_PI.md) · [SETTINGS_AND_SECURITY.md](docs/SETTINGS_AND_SECURITY.md) · [FEATURES.md](docs/FEATURES.md)
