name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore & test
        run: |
          dotnet restore WorkshopOS.sln
          dotnet test WorkshopOS.sln -c Release --no-restore
