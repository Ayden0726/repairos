name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workshopos
          POSTGRES_PASSWORD: workshopos_dev
          POSTGRES_DB: workshopos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshopos -d workshopos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore & test
        run: |
          dotnet restore WorkshopOS.sln
          dotnet test WorkshopOS.sln -c Release --no-restore
